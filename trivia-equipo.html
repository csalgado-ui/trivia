<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trivia del equipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* ---- paleta del club: celeste, negro y blanco (tomada de la app de asistencia) ---- */
    --pitch-dark:#0D0D0D;
    --pitch-mid:#171A1D;
    --chalk:#F4F6F8;
    --card:#FFFFFF;
    --ok:#2F9E44;
    --ok-bg:#E5F4EA;
    --bad:#C1443C;
    --bad-bg:#FBEAE9;
    --pending-border:#E3E6E9;
    --pending-bg:#F2F4F6;
    --amber:#2FA8DE;
    --ink:#15181B;
    --muted:#6B7280;
    /* ---- escudo: negro + celeste, iniciales del club ---- */
    --crest-a:#0D0D0D;
    --crest-b:#2FA8DE;
    --crest-text:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Work Sans', sans-serif;
    background:
      radial-gradient(circle at 10% 0%, #123246 0%, transparent 45%),
      var(--pitch-dark);
    color:var(--ink);
    min-height:100vh;
    padding:20px 14px 60px;
  }
  .wrap{max-width:520px; margin:0 auto;}

  /* ---- header / escudo ---- */
  .clip{
    position:relative;
    background:linear-gradient(160deg, var(--pitch-mid), var(--pitch-dark));
    border-radius:18px;
    padding:24px 20px 20px;
    color:var(--chalk);
    box-shadow:0 14px 30px -12px rgba(0,0,0,.55);
    border:1px solid rgba(244,239,228,.12);
    margin-bottom:16px;
  }
  .clip::before{
    content:"";
    position:absolute;
    top:-14px; left:50%; transform:translateX(-50%);
    width:78px; height:26px;
    background:var(--amber);
    border-radius:6px;
    box-shadow:0 4px 8px rgba(0,0,0,.35);
  }
  .clip-top{display:flex; align-items:center; gap:12px;}
  .crest{flex-shrink:0;}
  .eyebrow{
    font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--amber); font-weight:700; margin-bottom:4px;
  }
  .app-title{
    font-family:'Anton', sans-serif;
    font-size:clamp(20px,6vw,26px);
    letter-spacing:.01em;
    text-transform:uppercase;
    line-height:1.05;
  }
  .app-sub{
    font-size:12.5px; color:rgba(244,239,228,.8); margin-top:4px;
  }
  .back-row{margin-bottom:2px;}
  .back-btn{
    background:none; border:none; color:rgba(244,239,228,.85); font-size:13px;
    font-weight:700; cursor:pointer; padding:6px 2px; font-family:inherit;
  }

  /* ---- menu screen ---- */
  .menu-cards{display:flex; flex-direction:column; gap:12px;}
  .menu-card{
    display:flex; align-items:center; gap:14px; text-align:left;
    background:var(--card); border:none; border-radius:16px; padding:18px;
    cursor:pointer; box-shadow:0 10px 24px -14px rgba(0,0,0,.4); font-family:inherit;
  }
  .menu-card:active{transform:scale(.99);}
  .menu-ic{font-size:28px; flex-shrink:0;}
  .menu-t{font-weight:800; font-size:16px; color:var(--ink);}
  .menu-d{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .menu-card.entrenador{background:var(--pitch-mid);}
  .menu-card.entrenador .menu-t{color:var(--chalk);}
  .menu-card.entrenador .menu-d{color:rgba(244,239,228,.75);}

  /* ---- cards ---- */
  .card{
    background:var(--card);
    border-radius:16px;
    padding:18px;
    margin-bottom:14px;
    box-shadow:0 10px 24px -14px rgba(0,0,0,.4);
  }
  .card h3{margin:0 0 12px; font-size:15px; text-transform:uppercase; letter-spacing:.05em; color:var(--pitch-dark);}
  select, .textinput, textarea.textinput{
    width:100%; padding:11px 12px; border-radius:9px; border:1.5px solid var(--pending-border);
    font-size:15px; font-family:inherit; background:#fff; color:var(--ink); margin-bottom:8px;
  }
  textarea.textinput{resize:vertical; min-height:70px;}
  .hint{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .empty{text-align:center; color:var(--muted); padding:20px 0; font-size:14px;}
  .loading{color:var(--chalk); text-align:center; padding:60px 0; font-size:14px;}

  .confirm-btn{
    width:100%; margin-top:10px; padding:13px; border:none; border-radius:10px;
    background:var(--pitch-dark); color:var(--chalk); font-weight:800; font-size:15px;
    cursor:pointer; font-family:inherit;
  }
  .confirm-btn:disabled{opacity:.4; cursor:not-allowed;}
  .confirm-btn:not(:disabled):hover{background:var(--pitch-mid);}
  .ghost-btn{
    width:100%; margin-top:8px; padding:11px; border-radius:9px; font-weight:700; font-size:14px;
    cursor:pointer; font-family:inherit; background:none; border:1.5px solid var(--pending-border); color:var(--ink);
  }
  .danger-btn{border-color:var(--bad); color:var(--bad);}

  /* ---- quiz progress ---- */
  .prog-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-size:12.5px; color:var(--chalk); font-weight:700;}
  .prog-bar{height:7px; border-radius:6px; background:rgba(244,239,228,.18); overflow:hidden; margin-bottom:16px;}
  .prog-fill{height:100%; background:var(--amber);}

  .qtype-tag{
    display:inline-block; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;
    font-weight:700; color:var(--muted); background:var(--pending-bg); padding:3px 9px; border-radius:20px; margin-bottom:9px;
  }
  .qtext{font-size:17px; font-weight:800; color:var(--ink); margin-bottom:14px; line-height:1.35;}
  .opt-btn{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:13px 14px; border-radius:11px; border:2px solid var(--pending-border);
    background:#fff; font-size:14.5px; font-weight:600; cursor:pointer; font-family:inherit;
    margin-bottom:9px; color:var(--ink);
  }
  .opt-letter{
    width:26px; height:26px; border-radius:50%; background:var(--pending-bg); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12.5px; color:var(--muted);
  }
  .opt-btn.sel{border-color:var(--pitch-dark); background:var(--pending-bg);}
  .opt-btn.sel .opt-letter{background:var(--pitch-dark); color:var(--chalk);}
  .opt-btn.locked{cursor:default; opacity:.55;}

  .fb-banner{
    margin-top:6px; padding:11px 13px; border-radius:10px; font-size:13.5px; font-weight:700;
    background:var(--pending-bg); color:var(--ink);
  }

  .photo-box{
    width:100%; border-radius:14px; overflow:hidden; margin-bottom:14px; background:#000;
    aspect-ratio:4/3; display:flex; align-items:center; justify-content:center;
  }
  .photo-box img{
    width:100%; height:100%; object-fit:cover;
    filter:blur(15px) grayscale(.15) contrast(1.05);
    transform:scale(1.08);
  }
  .photo-box.small{aspect-ratio:1/1; width:64px; height:64px; border-radius:10px; flex-shrink:0;}
  .photo-box.small img{filter:blur(6px) grayscale(.15);}
  .photo-box.clear img{filter:none; transform:none;}

  /* ---- recap ---- */
  .recap-row{
    display:flex; align-items:flex-start; gap:10px; padding:11px 12px; border-radius:10px;
    margin-bottom:8px; border:1.5px solid var(--pending-border); background:var(--pending-bg);
  }
  .recap-q{font-size:13.5px; font-weight:700; margin-bottom:3px;}
  .recap-a{font-size:12.5px; color:var(--muted);}
  .recap-a b{color:var(--ink);}
  .recap-ic{font-size:16px; flex-shrink:0; margin-top:1px;}

  /* ---- coach: player list ---- */
  .rank-row{
    display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:10px;
    margin-bottom:8px; border:1.5px solid var(--pending-border); background:#fff; cursor:pointer;
  }
  .rank-row .avatar{
    width:34px; height:34px; border-radius:50%; background:var(--pending-bg); color:var(--muted);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex-shrink:0;
  }
  .rank-name{flex:1; font-weight:700; font-size:14px;}
  .rank-tag{font-size:11px; color:var(--muted); font-weight:600;}
  .rank-tag.orphan{color:var(--bad);}
  .rank-chev{color:var(--muted); font-size:13px;}
  .score-badge{
    flex-shrink:0; background:var(--amber); color:var(--pitch-dark); font-weight:800; font-size:12.5px;
    padding:5px 9px; border-radius:20px; white-space:nowrap;
  }
  .score-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; flex-wrap:wrap;}
  .score-pill{
    background:var(--amber); color:var(--pitch-dark); font-weight:800; font-size:12.5px;
    padding:6px 11px; border-radius:20px; white-space:nowrap;
  }
  .roster-actions{display:flex; gap:6px; flex-shrink:0;}
  .icon-btn{border:none; background:none; font-size:14px; cursor:pointer; padding:2px 4px; color:var(--muted);}

  /* ---- coach: player detail ---- */
  .detail-q{
    padding:12px 13px; border-radius:11px; border:1.5px solid var(--pending-border); background:var(--pending-bg);
    margin-bottom:9px;
  }
  .detail-top{display:flex; gap:10px;}
  .detail-body{flex:1;}
  .detail-qtext{font-weight:700; font-size:13.5px; margin-bottom:4px;}
  .detail-ans{font-size:13px; color:var(--ink);}
  .detail-ans.empty{color:var(--muted); font-style:italic;}
  .review-row{display:flex; gap:6px; margin-top:8px;}
  .review-btn{
    flex:1; padding:6px; border-radius:7px; border:1.5px solid var(--pending-border); background:#fff;
    font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; color:var(--muted);
  }
  .review-btn.ok.on{background:var(--ok); border-color:var(--ok); color:#fff;}
  .review-btn.bad.on{background:var(--bad); border-color:var(--bad); color:#fff;}

  /* ---- question builder ---- */
  .type-row{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
  .type-chip{
    padding:8px 12px; border-radius:20px; border:1.5px solid var(--pending-border); background:#fff;
    font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit; color:var(--muted);
  }
  .type-chip.on{background:var(--pitch-dark); border-color:var(--pitch-dark); color:var(--chalk);}
  .qform-opt{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .qform-opt input{margin-bottom:0; flex:1;}
  .correct-chip{
    flex-shrink:0; width:34px; height:34px; border-radius:9px; border:1.5px solid var(--pending-border);
    background:#fff; cursor:pointer; font-weight:800; font-size:12px; color:var(--muted); font-family:inherit;
  }
  .correct-chip.on{background:var(--ok); border-color:var(--ok); color:#fff;}
  .tf-row{display:flex; gap:10px; margin-bottom:10px;}
  .tf-chip{
    flex:1; padding:11px; border-radius:10px; border:1.5px solid var(--pending-border); background:#fff;
    font-weight:700; font-size:13.5px; cursor:pointer; font-family:inherit; color:var(--muted);
  }
  .tf-chip.on{background:var(--ok); border-color:var(--ok); color:#fff;}
  .file-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .file-row input[type=file]{flex:1; font-size:12.5px;}

  .qlist-row{
    padding:12px 13px; border-radius:11px; border:1.5px solid var(--pending-border); background:var(--pending-bg);
    margin-bottom:9px;
  }
  .qlist-top{display:flex; gap:10px; align-items:flex-start;}
  .qlist-text{font-weight:700; font-size:13.5px; flex:1;}
  .qlist-actions{display:flex; gap:6px; flex-shrink:0;}
  .qlist-meta{font-size:11.5px; color:var(--muted); font-weight:600; margin-top:5px;}

  .divider-title{
    font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:700;
    margin:2px 0 10px;
  }
  .coach-tabs{display:flex; gap:6px; margin-bottom:14px; background:rgba(244,239,228,.1); padding:4px; border-radius:11px;}
  .coach-tab{flex:1; text-align:center; padding:9px 4px; border-radius:8px; font-size:12.5px; font-weight:700; cursor:pointer; border:none; background:none; color:var(--chalk); font-family:inherit;}
  .coach-tab.active{background:var(--amber); color:var(--pitch-dark);}

  /* ---- coach password gate ---- */
  .lock-card{
    background:var(--card); border-radius:16px; padding:26px 20px; text-align:center;
    box-shadow:0 10px 24px -14px rgba(0,0,0,.4);
  }
  .lock-ic{font-size:32px; margin-bottom:8px;}
  .lock-card h3{margin:0 0 6px; font-size:16px; color:var(--pitch-dark);}
  .lock-card p{margin:0 0 16px; font-size:13px; color:var(--muted);}
  .lock-card input{
    width:100%; padding:12px; border-radius:9px; border:1.5px solid var(--pending-border);
    font-size:15px; text-align:center; margin-bottom:10px; font-family:inherit;
  }
  .lock-error{color:var(--bad); font-size:12.5px; font-weight:700; margin-bottom:10px;}
  .foot-link{
    text-align:center; font-size:12.5px; color:var(--muted); text-decoration:underline;
    cursor:pointer; margin-top:4px;
  }
  .foot-row{display:flex; justify-content:center; gap:18px; margin-top:6px;}

  /* ---- diálogos propios ---- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,10,10,.6);
    display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px;
  }
  .modal-box{
    background:var(--card); border-radius:16px; padding:20px; max-width:420px; width:100%;
    box-shadow:0 20px 50px -12px rgba(0,0,0,.55);
  }
  .modal-msg{font-size:14.5px; color:var(--ink); line-height:1.45;}
  .modal-actions{display:flex; gap:10px; margin-top:16px;}
  .modal-actions .ghost-btn, .modal-actions .confirm-btn{margin-top:0; flex:1;}
</style>
</head>

<script>
/* =====================================================================
   CONFIGURACIÓN DE FIREBASE — completar antes de publicar el archivo
   =====================================================================
   1. Andá a https://console.firebase.google.com → creá un proyecto (gratis).
   2. Buscá "Firestore Database" en el menú y creá una base (modo "producción").
   3. En "Reglas" de Firestore, pegá esto para que la app pueda leer y escribir
      (es una app simple sin login, así que queda abierta a quien tenga el link,
      igual de "seguro" que la clave del entrenador — no uses esto para nada sensible):

        rules_version = '2';
        service cloud.firestore {
          match /databases/{database}/documents {
            match /triviaData/{doc} { allow read, write: if true; }
          }
        }

   4. En el ícono de engranaje → "Configuración del proyecto" → bajá hasta
      "Tus apps" → creá una app Web (</>) → copiá el objeto de configuración
      y pegalo acá abajo, reemplazando el de ejemplo.
   ===================================================================== */
const firebaseConfig = {
  apiKey: "REEMPLAZAR_CON_TU_API_KEY",
  authDomain: "REEMPLAZAR.firebaseapp.com",
  projectId: "REEMPLAZAR",
  storageBucket: "REEMPLAZAR.appspot.com",
  messagingSenderId: "REEMPLAZAR",
  appId: "REEMPLAZAR"
};
const FIREBASE_CONFIGURED = firebaseConfig.apiKey !== "REEMPLAZAR_CON_TU_API_KEY";

let db = null;
if(FIREBASE_CONFIGURED){
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  }catch(e){ console.error('No se pudo inicializar Firebase', e); }
}

/* ---- reemplazo de window.storage: mismo contrato (get/set/delete con "shared"),
   pero respaldado en Firestore (datos compartidos) y localStorage (datos personales
   del celular, como "quién soy"). Así el resto de la app no necesita cambiar nada. ---- */
function lsKey(key){ return 'trivia_local_'+key; }
window.storage = {
  async get(key, shared){
    if(!shared){
      const v = localStorage.getItem(lsKey(key));
      if(v === null) throw new Error('missing key '+key);
      return { key, value: v, shared:false };
    }
    if(!db) throw new Error('Firebase no configurado');
    const snap = await db.collection('triviaData').doc(key).get();
    if(!snap.exists) throw new Error('missing key '+key);
    return { key, value: snap.data().value, shared:true };
  },
  async set(key, value, shared){
    if(!shared){
      localStorage.setItem(lsKey(key), value);
      return { key, value, shared:false };
    }
    if(!db) throw new Error('Firebase no configurado');
    await db.collection('triviaData').doc(key).set({ value });
    return { key, value, shared:true };
  },
  async delete(key, shared){
    if(!shared){
      localStorage.removeItem(lsKey(key));
      return { key, deleted:true, shared:false };
    }
    if(!db) throw new Error('Firebase no configurado');
    await db.collection('triviaData').doc(key).delete();
    return { key, deleted:true, shared:true };
  },
  async list(prefix, shared){ return { keys: [], shared: !!shared }; }
};

, {"id": "p-mateo-temchuk", "name": "Mateo Temchuk"}, {"id": "p-baltazar-sanchez", "name": "Baltazar Sanchez"}, {"id": "p-javier-rogberg", "name": "Javier Rogberg"}, {"id": "p-juan-ignacio-de-renzis", "name": "Juan Ignacio De Renzis"}]; // plantel inicial (se usa solo la primera vez, si todavía no hay plantel guardado)

const AUTO_RESET_MS = 12000; // tiempo que se muestra el repaso antes de reiniciar solo para el próximo jugador
let summaryTimeoutId = null;
function clearSummaryTimer(){ if(summaryTimeoutId){ clearTimeout(summaryTimeoutId); summaryTimeoutId = null; } }
function scheduleAutoReset(){
  if(summaryTimeoutId) return;
  summaryTimeoutId = setTimeout(() => { summaryTimeoutId = null; switchPlayer(); }, AUTO_RESET_MS);
}

/* ---------- storage ---------- */
async function loadAll(){
  if(!FIREBASE_CONFIGURED){
    // Todavía no se completó firebaseConfig (buscá esa constante al principio del archivo).
    // Se arma igual con el plantel inicial, pero en modo local: no se comparte entre dispositivos
    // hasta que se configure Firebase.
    state.storageUnavailable = true;
    state.gameId = 'g'+Date.now().toString(36);
    state.roster = DEFAULT_ROSTER.map(p => ({...p}));
    state.loading = false;
    render();
    return;
  }
  try{
    let gameId;
    try{ const r = await window.storage.get('gameId', true); gameId = r ? r.value : null; }catch(e){ gameId = null; }
    if(!gameId){
      gameId = 'g'+Date.now().toString(36);
      try{ await window.storage.set('gameId', gameId, true); }catch(e){}
    }
    state.gameId = gameId;

    try{ const r = await window.storage.get('questions', true); state.questions = r ? JSON.parse(r.value) : []; }catch(e){ state.questions = []; }
    try{
      const r = await window.storage.get('roster', true);
      state.roster = r ? JSON.parse(r.value) : [];
    }catch(e){
      // todavía no existe ningún plantel guardado: se siembra con la lista inicial del equipo
      state.roster = DEFAULT_ROSTER.map(p => ({...p}));
      try{ await window.storage.set('roster', JSON.stringify(state.roster), true); }catch(e2){}
    }
    try{ const r = await window.storage.get('photoGroups', true); state.photoGroups = r ? JSON.parse(r.value) : []; }catch(e){ state.photoGroups = []; }
    try{ const r = await window.storage.get('responses:'+gameId, true); state.responses = r ? JSON.parse(r.value) : {}; }catch(e){ state.responses = {}; }
    try{ const r = await window.storage.get('seasonScores', true); state.seasonScores = r ? JSON.parse(r.value) : {}; }catch(e){ state.seasonScores = {}; }
    try{ const r = await window.storage.get('coachPass', true); state.coachPass = r ? r.value : null; }catch(e){ state.coachPass = null; }
    try{ const r = await window.storage.get('my_id', false); state.myId = r ? r.value : ''; }catch(e){ state.myId = ''; }
    try{ const r = await window.storage.get('my_name', false); state.myName = r ? r.value : ''; }catch(e){ state.myName = ''; }
  }catch(e){ console.error('Error cargando datos', e); }
  state.loading = false;
  render();
}

async function refreshShared(){
  try{ const r = await window.storage.get('gameId', true); if(r) state.gameId = r.value; }catch(e){}
  try{ const r = await window.storage.get('questions', true); state.questions = r ? JSON.parse(r.value) : []; }catch(e){}
  try{ const r = await window.storage.get('roster', true); state.roster = r ? JSON.parse(r.value) : []; }catch(e){}
  try{ const r = await window.storage.get('photoGroups', true); state.photoGroups = r ? JSON.parse(r.value) : []; }catch(e){}
  try{ const r = await window.storage.get('responses:'+state.gameId, true); state.responses = r ? JSON.parse(r.value) : {}; }catch(e){ state.responses = {}; }
  try{ const r = await window.storage.get('seasonScores', true); state.seasonScores = r ? JSON.parse(r.value) : {}; }catch(e){}
  try{ const r = await window.storage.get('coachPass', true); state.coachPass = r ? r.value : null; }catch(e){}
}

async function saveQuestions(){ try{ await window.storage.set('questions', JSON.stringify(state.questions), true); }catch(e){ console.error(e); } }
async function saveRoster(){ try{ await window.storage.set('roster', JSON.stringify(state.roster), true); }catch(e){ console.error(e); } }
async function savePhotoGroups(){ try{ await window.storage.set('photoGroups', JSON.stringify(state.photoGroups), true); }catch(e){ console.error(e); } }
async function saveResponses(){ try{ await window.storage.set('responses:'+state.gameId, JSON.stringify(state.responses), true); }catch(e){ console.error(e); } }
async function saveSeasonScores(){ try{ await window.storage.set('seasonScores', JSON.stringify(state.seasonScores), true); }catch(e){ console.error(e); } }
async function deletePlayerCompletely(id){
  const name = findRosterName(id) || state.responses[id]?.name || id;
  showConfirm(`Esto elimina a ${name} del plantel y borra, de forma permanente, sus respuestas y su puntaje acumulado. ¿Seguro?`, async () => {
    state.roster = state.roster.filter(p => p.id !== id);
    await saveRoster();
    if(state.responses[id]){ delete state.responses[id]; await saveResponses(); }
    if(state.seasonScores[id] !== undefined){ delete state.seasonScores[id]; await saveSeasonScores(); }
    if(state.reviewingId === id) state.reviewingId = null;
    render();
  });
}
async function savePassword(p){ try{ await window.storage.set('coachPass', p, true); state.coachPass = p; }catch(e){ console.error(e); } }
async function setMyId(id, name){ state.myId = id; state.myName = name; try{ await window.storage.set('my_id', id, false); await window.storage.set('my_name', name, false); }catch(e){} }
async function loadDefaultRoster(){
  let added = 0;
  for(const p of DEFAULT_ROSTER){
    if(!state.roster.some(r => r.name.toLowerCase() === p.name.toLowerCase())){
      state.roster.push({ id: p.id, name: p.name });
      added++;
    }
  }
  if(added > 0) await saveRoster();
  render();
  showAlert(added > 0 ? `Se agregaron ${added} jugador(es) que faltaban.` : 'Ya estaban todos los jugadores del plantel inicial.');
}
async function switchPlayer(){
  clearSummaryTimer();
  state.myId = '';
  state.myName = '';
  state.qIndex = 0;
  state.draftAnswer = null;
  state.answered = false;
  state.showNewName = false;
  try{ await window.storage.delete('my_id', false); }catch(e){}
  try{ await window.storage.delete('my_name', false); }catch(e){}
  render();
}

async function loadPhoto(qid){
  if(qid in state.photoCache) return state.photoCache[qid];
  try{ const r = await window.storage.get('photo:'+qid, true); state.photoCache[qid] = r ? r.value : null; }
  catch(e){ state.photoCache[qid] = null; }
  return state.photoCache[qid];
}
async function prefetchPhotos(qids){ for(const id of qids){ await loadPhoto(id); } }
async function prefetchAllKnownPhotos(){
  const keys = new Set();
  for(const g of state.photoGroups) keys.add(g.id);
  for(const q of state.questions){ if(q.type === 'foto' || q.hasPhoto) keys.add(q.id); }
  await prefetchPhotos([...keys]);
}

function newId(prefix){ return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* ---------- roster / players ---------- */
function findRosterName(id){
  const p = state.roster.find(p => p.id === id);
  return p ? p.name : null;
}
function allPlayerIds(){
  return Array.from(new Set([...state.roster.map(p=>p.id), ...Object.keys(state.responses)]));
}
function effectiveReview(entry, q){
  if(!entry) return null;
  if(q.type === 'choice'){
    const val = entry.answers ? entry.answers[q.id] : undefined;
    if(val === undefined || val === null || val === '') return null;
    return val === q.correct ? 'ok' : 'bad';
  }
  return entry.reviewed ? entry.reviewed[q.id] : null;
}
function playerScore(id){
  const entry = state.responses[id];
  if(!entry) return 0;
  let n = 0;
  for(const q of state.questions){ if(effectiveReview(entry, q) === 'ok') n++; }
  return n;
}
function playerReviewedCount(id){
  const entry = state.responses[id];
  if(!entry) return 0;
  let n = 0;
  for(const q of state.questions){ if(effectiveReview(entry, q)) n++; }
  return n;
}
function playerSeasonTotal(id){
  // acumulado de semanas anteriores + lo revisado en el juego actual (solo lo ve el entrenador)
  return (state.seasonScores[id] || 0) + playerScore(id);
}

/* ---------- game logic ---------- */
function questionHasPhoto(q){ return q.type === 'foto' || !!q.hasPhoto || !!q.photoGroupId; }
function questionPhotoKey(q){ return q.photoGroupId || q.id; }

function sortedQuestions(){
  const normal = state.questions.filter(q => q.type !== 'foto');
  const fotos = state.questions.filter(q => q.type === 'foto');
  return [...normal, ...fotos];
}
function myEntry(){
  if(!state.responses[state.myId]) state.responses[state.myId] = { name: state.myName, answers:{}, reviewed:{} };
  return state.responses[state.myId];
}
function resumeIndex(){
  const mine = state.responses[state.myId];
  const qs = sortedQuestions();
  if(!mine) return 0;
  for(let i=0;i<qs.length;i++){ if(!(qs[i].id in (mine.answers||{}))) return i; }
  return qs.length;
}
function currentAnswerValid(){
  const q = sortedQuestions()[state.qIndex];
  if(!q) return false;
  if(q.type === 'texto' || q.type === 'foto') return typeof state.draftAnswer === 'string' && state.draftAnswer.trim().length > 0;
  return state.draftAnswer !== null && state.draftAnswer !== undefined;
}

async function newGame(keepQuestions){
  const msg = keepQuestions
    ? 'Esto suma el puntaje de esta semana al acumulado histórico, borra las respuestas, y todos vuelven a empezar con las mismas preguntas. ¿Seguro?'
    : 'Esto suma el puntaje de esta semana al acumulado histórico, y borra preguntas, fotos y respuestas para armar un juego nuevo desde cero. ¿Seguro?';
  showConfirm(msg, async () => {
    // el puntaje de esta semana pasa a la cuenta histórica (solo la ve el entrenador) antes de resetear
    for(const id of allPlayerIds()){
      const pts = playerScore(id);
      if(pts > 0) state.seasonScores[id] = (state.seasonScores[id] || 0) + pts;
    }
    await saveSeasonScores();

    if(!keepQuestions){
      for(const q of state.questions){ if(q.type === 'foto' || q.hasPhoto){ try{ await window.storage.delete('photo:'+q.id, true); }catch(e){} } }
      state.questions = [];
      await saveQuestions();
    }
    const gid = newId('g');
    state.gameId = gid;
    state.responses = {};
    state.photoCache = {};
    try{
      await window.storage.set('gameId', gid, true);
      await window.storage.set('responses:'+gid, JSON.stringify({}), true);
    }catch(e){ console.error(e); }
    render();
  });
}

/* ---------- image helper ---------- */
function readAndResizeImage(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxW = 480;
        const scale = Math.min(1, maxW / img.width);
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------- excel export ---------- */
function formatAnswer(q, raw){
  if(raw === undefined || raw === null || raw === '') return 'Sin responder';
  if(q.type === 'choice') return q.options[raw] ?? 'Sin responder';
  if(q.type === 'tf') return raw === 'V' ? 'Verdadero' : (raw === 'F' ? 'Falso' : 'Sin responder');
  return String(raw);
}
function reviewLabel(v){ return v === 'ok' ? 'Correcta' : (v === 'bad' ? 'Incorrecta' : ''); }

function downloadExcel(){
  if(typeof XLSX === 'undefined'){ showAlert('No se pudo cargar el generador de Excel. Revisá tu conexión e intentá de nuevo.'); return; }
  const rows = [['Jugador','Pregunta','Tipo','Respuesta','Revisión']];
  const ids = allPlayerIds();
  for(const id of ids){
    const name = findRosterName(id) || state.responses[id]?.name || id;
    const entry = state.responses[id];
    for(const q of state.questions){
      const raw = entry?.answers?.[q.id];
      rows.push([name, q.text, TYPE_LABEL[q.type] || q.type, formatAnswer(q, raw), reviewLabel(effectiveReview(entry, q))]);
    }
  }
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:18},{wch:40},{wch:16},{wch:28},{wch:12}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Respuestas');
  XLSX.writeFile(wb, 'trivia-respuestas.xlsx');
}

function crestSvg(size){
  size = size || 46;
  return `<img class="crest" src="${CREST_IMG}" width="${size}" height="${size}" style="object-fit:contain; border-radius:6px;" alt="Escudo del Centro de Graduados del Liceo Naval Militar">`;
}

function render(){
  const app = document.getElementById('app');
  if(state.loading){ app.innerHTML = '<div class="loading">Cargando trivia…</div>'; return; }

  if(state.screen === 'menu') app.innerHTML = renderMenu();
  else if(state.screen === 'jugador') app.innerHTML = renderJugadorScreen();
  else app.innerHTML = renderEntrenadorScreen();

  app.innerHTML += renderModal();
  attachEvents();
}

/* ---------- diálogos propios (los nativos confirm/alert/prompt quedan bloqueados en este entorno) ---------- */
function showAlert(message){ state.modal = { kind:'alert', message }; render(); }
function showConfirm(message, onYes){ state.modal = { kind:'confirm', message, onYes }; render(); }
function showPrompt(message, value, onSubmit){ state.modal = { kind:'prompt', message, value: value || '', onSubmit }; render(); }

function renderModal(){
  const m = state.modal;
  if(!m) return '';
  if(m.kind === 'alert'){
    return `
      <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
          <div class="modal-msg">${escapeHtml(m.message)}</div>
          <div class="modal-actions"><button class="confirm-btn" id="modalOk">Entendido</button></div>
        </div>
      </div>
    `;
  }
  if(m.kind === 'confirm'){
    return `
      <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
          <div class="modal-msg">${escapeHtml(m.message)}</div>
          <div class="modal-actions">
            <button class="ghost-btn" id="modalCancel">Cancelar</button>
            <button class="confirm-btn" id="modalYes">Confirmar</button>
          </div>
        </div>
      </div>
    `;
  }
  if(m.kind === 'prompt'){
    return `
      <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
          <div class="modal-msg">${escapeHtml(m.message)}</div>
          <input class="textinput" id="modalInput" value="${escapeAttr(m.value)}" style="margin-top:10px;" autofocus>
          <div class="modal-actions">
            <button class="ghost-btn" id="modalCancel">Cancelar</button>
            <button class="confirm-btn" id="modalYes">Guardar</button>
          </div>
        </div>
      </div>
    `;
  }
  return '';
}

function renderQuestion(q, idx, total){
  const pct = Math.round((idx/total)*100);
  let inner = '';
  const refPhoto = (q.type !== 'foto' && questionHasPhoto(q)) ? `<div class="photo-box clear">${state.photoCache[questionPhotoKey(q)] ? `<img src="${state.photoCache[questionPhotoKey(q)]}" alt="foto">` : ''}</div>` : '';

  if(q.type === 'tf'){
    inner = `
      <div class="opt-btn ${state.draftAnswer==='V' ? 'sel' : ''}" data-tf="V" role="button"><span class="opt-letter">V</span><span>Verdadero</span></div>
      <div class="opt-btn ${state.draftAnswer==='F' ? 'sel' : ''}" data-tf="F" role="button"><span class="opt-letter">F</span><span>Falso</span></div>
    `;
  } else if(q.type === 'choice'){
    const letters = ['A','B','C','D'];
    inner = q.options.map((opt,i) => `
      <div class="opt-btn ${state.draftAnswer===i ? 'sel' : ''}" data-choice="${i}" role="button">
        <span class="opt-letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>
      </div>
    `).join('');
  } else if(q.type === 'texto'){
    inner = `<textarea class="textinput" id="freeTextInput" placeholder="Escribí tu respuesta">${escapeHtml(state.draftAnswer || '')}</textarea>`;
  } else if(q.type === 'foto'){
    const photo = state.photoCache[questionPhotoKey(q)];
    inner = `
      <div class="photo-box">${photo ? `<img src="${photo}" alt="foto">` : ''}</div>
      <input class="textinput" id="freeTextInput" placeholder="¿Quién es?" value="${escapeAttr(state.draftAnswer || '')}">
    `;
  }

  return `
    <div class="prog-row"><span>Pregunta ${idx+1} de ${total}</span></div>
    <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
    <div class="card">
      <div class="qtype-tag">${TYPE_LABEL[q.type]}</div>
      <div class="qtext">${escapeHtml(q.text)}</div>
      ${refPhoto}
      ${inner}
      ${state.answered ? `
        <div class="fb-banner">✔ Respuesta guardada.</div>
        <button class="confirm-btn" id="nextBtn">${idx+1 < total ? 'Siguiente pregunta' : 'Terminar'}</button>
      ` : `
        <button class="confirm-btn" id="confirmBtn" ${currentAnswerValid() ? '' : 'disabled'}>Guardar respuesta</button>
      `}
    </div>
  `;
}

function renderSummary(qs){
  const mine = state.responses[state.myId] || { answers:{} };
  const answeredCount = qs.filter(q => q.id in (mine.answers||{})).length;
  const recap = qs.map(q => ({ q, val: mine.answers[q.id] }));

  return `
    <div class="card">
      <div style="text-align:center;">
        <div style="font-size:30px;">🎉</div>
        <div style="font-weight:800; font-size:16px; margin-top:6px;">¡Terminaste la trivia!</div>
        <div class="hint">Respondiste ${answeredCount} de ${qs.length} preguntas. ¡Gracias por jugar!</div>
        <div class="hint" style="margin-top:6px;">Esta pantalla se reinicia sola en unos segundos para que juegue el próximo.</div>
        <button class="confirm-btn" id="switchPlayerBtn" style="margin-top:14px;">👤 Que juegue otro ahora</button>
      </div>
    </div>
    <div class="card">
      <h3>Tu repaso</h3>
      ${recap.map(r => `
        <div class="recap-row">
          ${questionHasPhoto(r.q) ? `<div class="photo-box small clear">${state.photoCache[questionPhotoKey(r.q)] ? `<img src="${state.photoCache[questionPhotoKey(r.q)]}">` : ''}</div>` : ''}
          <div style="flex:1;">
            <div class="recap-q">${escapeHtml(r.q.text)}</div>
            <div class="recap-a">Tu respuesta: <b>${escapeHtml(formatAnswer(r.q, r.val))}</b></div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderCoachPreguntas(){
  const dq = state.draftQ;
  const letters = ['A','B','C','D'];
  let typeFields = '';
  if(dq.type === 'choice'){
    typeFields = [0,1,2,3].map(i => `
      <div class="qform-opt">
        <input class="textinput" style="margin-bottom:0;" id="qOpt${i}" placeholder="Opción ${letters[i]}" value="${escapeAttr(dq.options[i])}">
        <button class="correct-chip ${dq.correct === i ? 'on' : ''}" data-correct="${i}" title="Marcar como correcta">${letters[i]}</button>
      </div>
    `).join('') + `<div class="hint">Tocá la letra para marcar cuál opción es la correcta.</div>`;
  } else if(dq.type === 'tf'){
    typeFields = `
      <div class="tf-row">
        <button class="tf-chip ${dq.tf==='V'?'on':''}" data-tfcorrect="V">Verdadero</button>
        <button class="tf-chip ${dq.tf==='F'?'on':''}" data-tfcorrect="F">Falso</button>
      </div>
      <div class="hint">Opcional: marcá la correcta como referencia para cuando revises.</div>
    `;
  } else if(dq.type === 'texto'){
    typeFields = `<div class="hint">No tiene una única respuesta correcta: la vas a revisar vos, jugador por jugador.</div>`;
  } else if(dq.type === 'foto'){
    typeFields = `
      <input class="textinput" id="qCorrectText" placeholder="Nombre correcto (referencia interna, opcional)" value="${escapeAttr(dq.correctText)}">
      <div class="hint">Esta foto se muestra borrosa a los jugadores para que adivinen quién es.</div>
    `;
  }

  const modeOptions = dq.type === 'foto'
    ? [['own','Subir foto'],['group','Usar foto general']]
    : [['none','Sin foto'],['own','Subir foto'],['group','Usar foto general']];

  let photoModeBody = '';
  if(dq.photoMode === 'own'){
    photoModeBody = `
      <div class="file-row">
        <input type="file" id="qPhotoInput" accept="image/*">
        ${dq.photoData ? `<div class="photo-box small clear"><img src="${dq.photoData}"></div>` : ''}
      </div>
    `;
  } else if(dq.photoMode === 'group'){
    photoModeBody = state.photoGroups.length === 0
      ? `<div class="hint">Todavía no cargaste ninguna foto general. Agregá una en "Fotos generales", más abajo.</div>`
      : `
        <select id="qPhotoGroupSelect">
          <option value="">Elegí una foto…</option>
          ${state.photoGroups.map(g => `<option value="${escapeAttr(g.id)}" ${dq.photoGroupId===g.id?'selected':''}>${escapeHtml(g.name)}</option>`).join('')}
        </select>
        ${dq.photoGroupId && state.photoCache[dq.photoGroupId] ? `<div class="photo-box small clear"><img src="${state.photoCache[dq.photoGroupId]}"></div>` : ''}
      `;
  }

  const photoBlock = `
    <div class="hint" style="margin-top:12px; margin-bottom:4px;">${dq.type === 'foto' ? 'Foto (obligatoria, se muestra borrosa)' : 'Foto (opcional, se muestra nítida junto a la pregunta)'}</div>
    <div class="type-row">
      ${modeOptions.map(([m,label]) => `<button type="button" class="type-chip ${dq.photoMode===m?'on':''}" data-photomode="${m}">${label}</button>`).join('')}
    </div>
    ${photoModeBody}
  `;

  return `
    <div class="card">
      <h3>Fotos generales</h3>
      <div class="hint" style="margin-bottom:10px;">Subí una foto acá para usarla en varias preguntas (por ejemplo: mostrar una foto y hacer dos o tres preguntas sobre ella).</div>
      ${state.photoGroups.length === 0 ? '<div class="empty">Todavía no cargaste ninguna.</div>' : ''}
      ${state.photoGroups.map(g => `
        <div class="qlist-row">
          <div class="qlist-top">
            <div class="photo-box small clear">${state.photoCache[g.id] ? `<img src="${state.photoCache[g.id]}">` : ''}</div>
            <div class="qlist-text">${escapeHtml(g.name)}</div>
            <div class="qlist-actions">
              <button class="icon-btn" data-deletegroup="${escapeAttr(g.id)}" title="Eliminar">🗑️</button>
            </div>
          </div>
        </div>
      `).join('')}
      <input class="textinput" id="groupNameInput" placeholder="Nombre (ej: Foto de la cancha nueva)" value="${escapeAttr(state.draftPhotoGroup.name)}">
      <div class="file-row">
        <input type="file" id="groupPhotoInput" accept="image/*">
        ${state.draftPhotoGroup.photoData ? `<div class="photo-box small clear"><img src="${state.draftPhotoGroup.photoData}"></div>` : ''}
      </div>
      <button class="ghost-btn" id="addPhotoGroupBtn" style="margin-top:0;">➕ Agregar foto general</button>
    </div>

    <div class="card">
      <h3>${state.editingId ? 'Editar pregunta' : 'Nueva pregunta'}</h3>
      <div class="type-row">
        ${Object.keys(TYPE_LABEL).map(t => `<button class="type-chip ${dq.type===t?'on':''}" data-qtype="${t}">${TYPE_LABEL[t]}</button>`).join('')}
      </div>
      <input class="textinput" id="qTextInput" placeholder="Escribí la pregunta" value="${escapeAttr(dq.text)}">
      ${typeFields}
      ${photoBlock}
      <button class="confirm-btn" id="saveQBtn">${state.editingId ? 'Guardar cambios' : 'Agregar pregunta'}</button>
      ${state.editingId ? `<button class="ghost-btn" id="cancelEditQ">Cancelar edición</button>` : ''}
    </div>

    <div class="card">
      <h3>Preguntas cargadas (${state.questions.length})</h3>
      ${state.questions.length === 0 ? '<div class="empty">Todavía no cargaste ninguna pregunta.</div>' : ''}
      ${state.questions.map(q => `
        <div class="qlist-row">
          <div class="qlist-top">
            ${questionHasPhoto(q) ? `<div class="photo-box small clear">${state.photoCache[questionPhotoKey(q)] ? `<img src="${state.photoCache[questionPhotoKey(q)]}">` : ''}</div>` : ''}
            <div class="qlist-text">${escapeHtml(q.text)}</div>
            <div class="qlist-actions">
              <button class="icon-btn" data-edit="${escapeAttr(q.id)}" title="Editar">✏️</button>
              <button class="icon-btn" data-delete="${escapeAttr(q.id)}" title="Eliminar">🗑️</button>
            </div>
          </div>
          <div class="qlist-meta">${TYPE_LABEL[q.type]}${q.photoGroupId ? ` · usa "${escapeHtml(state.photoGroups.find(g=>g.id===q.photoGroupId)?.name || 'foto general')}"` : ''}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderCoachJugadores(){
  const ids = allPlayerIds();
  if(state.reviewingId){
    const id = state.reviewingId;
    const name = findRosterName(id) || state.responses[id]?.name || id;
    const entry = state.responses[id] || { answers:{}, reviewed:{} };
    const weekScore = playerScore(id);
    const reviewed = playerReviewedCount(id);
    const total = playerSeasonTotal(id);
    return `
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px;">
          <button class="ghost-btn" id="backToList" style="margin-top:0;">← Volver a la lista</button>
          <button class="icon-btn" data-deleteplayer="${escapeAttr(id)}" title="Eliminar jugador" style="font-size:18px;">🗑️</button>
        </div>
        <div class="score-head">
          <h3 style="margin:0;">${escapeHtml(name)}</h3>
          <div class="score-pill">🏆 ${total} pts acumulados</div>
        </div>
        <div class="hint" style="margin-bottom:12px;">Esta semana: ${weekScore} pts · revisadas ${reviewed}/${state.questions.length}</div>
        ${state.questions.length === 0 ? '<div class="empty">Todavía no hay preguntas.</div>' : ''}
        ${state.questions.map(q => {
          const raw = entry.answers ? entry.answers[q.id] : undefined;
          const has = raw !== undefined && raw !== null && raw !== '';
          const rev = effectiveReview(entry, q);
          return `
            <div class="detail-q">
              <div class="detail-top">
                ${questionHasPhoto(q) ? `<div class="photo-box small clear">${state.photoCache[questionPhotoKey(q)] ? `<img src="${state.photoCache[questionPhotoKey(q)]}">` : ''}</div>` : ''}
                <div class="detail-body">
                  <div class="detail-qtext">${escapeHtml(q.text)}${q.type==='foto' && q.correctText ? ` <span class="hint">(correcto: ${escapeHtml(q.correctText)})</span>` : ''}</div>
                  <div class="detail-ans ${has ? '' : 'empty'}">${has ? escapeHtml(formatAnswer(q, raw)) : 'Sin responder'}</div>
                </div>
              </div>
              ${q.type === 'choice' ? (has ? `
                <div class="fb-banner" style="margin-top:8px;">${rev === 'ok' ? '✅ Correcta (automática)' : '❌ Incorrecta (automática)'} · correcta: ${escapeHtml(q.options[q.correct])}</div>
              ` : '') : `
              <div class="review-row">
                <button class="review-btn ok ${rev==='ok'?'on':''}" data-review="${escapeAttr(q.id)}|ok" data-pid="${escapeAttr(id)}">✅ Correcta</button>
                <button class="review-btn bad ${rev==='bad'?'on':''}" data-review="${escapeAttr(q.id)}|bad" data-pid="${escapeAttr(id)}">❌ Incorrecta</button>
              </div>
              `}
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  const sortedIds = [...ids].sort((a,b) => playerSeasonTotal(b) - playerSeasonTotal(a) || a.localeCompare(b));
  return `
    <div class="card">
      <button class="ghost-btn" id="downloadExcelBtn" style="margin-top:0;">⬇️ Descargar respuestas (Excel)</button>
      <div class="hint" style="margin-top:12px; margin-bottom:4px;">Agregar un jugador</div>
      <div class="add-row" style="display:flex; gap:8px;">
        <input class="textinput" id="newPlayerInput" placeholder="Nombre del jugador" style="margin-bottom:0;">
        <button class="ghost-btn" id="addPlayerBtn" style="margin-top:0; width:auto; white-space:nowrap;">➕ Agregar</button>
      </div>
      <button class="ghost-btn" id="loadDefaultRosterBtn" style="margin-top:8px;">🔄 Completar con el plantel inicial del equipo</button>
    </div>
    <div class="card">
      <h3>Jugadores (${ids.length})</h3>
      <div class="hint" style="margin-top:-8px; margin-bottom:12px;">El puntaje acumulado de semana a semana solo lo ves vos.</div>
      ${ids.length === 0 ? '<div class="empty">Todavía no se sumó nadie.</div>' : ''}
      ${sortedIds.map((id,i) => {
        const inRoster = !!findRosterName(id);
        const name = findRosterName(id) || state.responses[id]?.name || id;
        const entry = state.responses[id];
        const done = entry ? Object.keys(entry.answers||{}).length : 0;
        const reviewed = playerReviewedCount(id);
        const total = playerSeasonTotal(id);
        return `
          <div class="rank-row" data-open="${escapeAttr(id)}">
            <div class="avatar">${escapeHtml((name||'?').slice(0,1).toUpperCase())}</div>
            <div style="flex:1;">
              <div class="rank-name">${escapeHtml(name)}</div>
              <div class="rank-tag ${inRoster?'':'orphan'}">${inRoster ? `Respondió ${done}/${state.questions.length} · revisadas ${reviewed}` : 'Fuera del plantel actual'}</div>
            </div>
            <div class="score-badge">🏆 ${total}</div>
            ${inRoster ? `
              <div class="roster-actions">
                <button class="icon-btn" data-rename="${escapeAttr(id)}" title="Renombrar">✏️</button>
                <button class="icon-btn" data-removeplayer="${escapeAttr(id)}" title="Quitar del plantel">🗑️</button>
              </div>
            ` : ''}
            <span class="rank-chev">›</span>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderCoachJuego(){

  return `

      ${sortedIds.length === 0 ? '<div class="empty">Todavía no hay jugadores.</div>' : ''}
      ${sortedIds.map((id,i) => {
        const name = findRosterName(id) || state.responses[id]?.name || id;
        const total = playerSeasonTotal(id);
        return `
          <div class="rank-row" style="cursor:default;">
            <div class="avatar">${escapeHtml((name||'?').slice(0,1).toUpperCase())}</div>
            <div style="flex:1;">
              <div class="rank-name">${escapeHtml(name)}</div>
            </div>
            <div class="score-badge">🏆 ${total}</div>
          </div>
        `;
      }).join('')}
    </div>
    <div class="card">
      <div class="foot-row">
        <div class="foot-link" id="togglePass">🔑 Cambiar clave</div>
        <div class="foot-link" id="lockBtn">🔒 Cerrar sesión</div>
      </div>
      ${state.changingPass ? `
        <div style="margin-top:14px;">
          <input class="textinput" type="password" id="newPassInput" placeholder="Nueva clave">
          <input class="textinput" type="password" id="newPassConfirm" placeholder="Repetí la clave">
          ${state.passError ? `<div class="lock-error">${escapeHtml(state.passError)}</div>` : ''}
          <button class="confirm-btn" id="savePassBtn">Actualizar clave</button>
        </div>
      ` : ''}
    </div>
  `;
}

/* ---------- events ---------- */
function attachEvents(){
  const $ = id => document.getElementById(id);

  /* diálogos propios */
  if($('modalOk')) $('modalOk').onclick = () => { state.modal = null; render(); };
  if($('modalCancel')) $('modalCancel').onclick = () => { state.modal = null; render(); };
  if($('modalYes')) $('modalYes').onclick = () => {
    const m = state.modal;
    const inputVal = $('modalInput') ? $('modalInput').value : undefined;
    state.modal = null;
    render();
    if(!m) return;
    if(m.kind === 'confirm' && m.onYes) m.onYes();
    else if(m.kind === 'prompt' && m.onSubmit) m.onSubmit(inputVal !== undefined ? inputVal : m.value);
  };

  if($('goJugador')) $('goJugador').onclick = async () => {
    await refreshShared();
    if(state.myId){
      state.qIndex = resumeIndex();
      const qs = sortedQuestions();
      await prefetchPhotos(qs.filter(questionHasPhoto).map(questionPhotoKey));
    }
    state.draftAnswer = null; state.answered = false;
    state.screen = 'jugador'; render();
  };
  if($('goEntrenador')) $('goEntrenador').onclick = async () => {
    await refreshShared();
    await prefetchAllKnownPhotos();
    state.screen = 'entrenador'; render();
  };
  if($('goMenu')) $('goMenu').onclick = () => { clearSummaryTimer(); state.screen = 'menu'; state.passError=''; state.reviewingId=null; render(); };
  if($('switchPlayerLink')) $('switchPlayerLink').onclick = switchPlayer;
  if($('switchPlayerBtn')) $('switchPlayerBtn').onclick = switchPlayer;

  /* jugador: elegir nombre */
  if($('nameSelect')) $('nameSelect').onchange = async (e) => {
    if(e.target.value === '__new__'){ state.showNewName = true; render(); return; }
    if(e.target.value){
      const p = state.roster.find(p => p.id === e.target.value);
      if(p){
        await setMyId(p.id, p.name);
        state.qIndex = resumeIndex();
        const qs = sortedQuestions();
        await prefetchPhotos(qs.filter(questionHasPhoto).map(questionPhotoKey));
        render();
      }
    }
  };
  if($('confirmNewName')) $('confirmNewName').onclick = async () => {
    const val = $('newNameInput').value.trim();
    if(!val) return;
    const id = newId('p');
    state.roster.push({ id, name: val });
    await saveRoster();
    await setMyId(id, val);
    state.showNewName = false;
    state.qIndex = resumeIndex();
    const qs = sortedQuestions();
    await prefetchPhotos(qs.filter(questionHasPhoto).map(questionPhotoKey));
    render();
  };

  /* jugador: responder */
  document.querySelectorAll('[data-tf]').forEach(el => { el.onclick = () => { state.draftAnswer = el.getAttribute('data-tf'); render(); }; });
  document.querySelectorAll('[data-choice]').forEach(el => { el.onclick = () => { state.draftAnswer = Number(el.getAttribute('data-choice')); render(); }; });
  if($('freeTextInput')) $('freeTextInput').oninput = (e) => { state.draftAnswer = e.target.value; $('confirmBtn').disabled = !currentAnswerValid(); };

  if($('confirmBtn')) $('confirmBtn').onclick = async () => {
    if(!currentAnswerValid()) return;
    const qs = sortedQuestions();
    const q = qs[state.qIndex];
    const val = (q.type === 'texto' || q.type === 'foto') ? state.draftAnswer.trim() : state.draftAnswer;
    const entry = myEntry();
    entry.answers[q.id] = val;
    entry.name = state.myName;
    await saveResponses();
    state.answered = true;
    render();
  };
  if($('nextBtn')) $('nextBtn').onclick = async () => {
    state.qIndex += 1;
    state.draftAnswer = null;
    state.answered = false;
    const qs = sortedQuestions();
    if(state.qIndex < qs.length && qs[state.qIndex].type === 'foto'){ await loadPhoto(qs[state.qIndex].id); }
    else if(state.qIndex >= qs.length){ await prefetchPhotos(qs.filter(questionHasPhoto).map(questionPhotoKey)); }
    render();
  };

  /* coach: password gate */
  if($('setPassBtn')) $('setPassBtn').onclick = async () => {
    const p1 = $('setPassInput').value.trim();
    const p2 = $('setPassConfirm').value.trim();
    if(!p1 || p1.length < 4){ state.passError = 'La clave debe tener al menos 4 caracteres.'; render(); return; }
    if(p1 !== p2){ state.passError = 'Las claves no coinciden.'; render(); return; }
    await savePassword(p1);
    state.coachAuthed = true; state.passError = '';
    render();
  };
  if($('checkPassBtn')) $('checkPassBtn').onclick = () => {
    const p = $('passInput').value.trim();
    if(p === state.coachPass){ state.coachAuthed = true; state.passError = ''; }
    else state.passError = 'Clave incorrecta.';
    render();
  };
  if($('passInput')) $('passInput').onkeydown = (e) => { if(e.key === 'Enter') $('checkPassBtn').click(); };

  if($('togglePass')) $('togglePass').onclick = () => { state.changingPass = !state.changingPass; state.passError=''; render(); };
  if($('savePassBtn')) $('savePassBtn').onclick = async () => {
    const p1 = $('newPassInput').value.trim();
    const p2 = $('newPassConfirm').value.trim();
    if(!p1 || p1.length < 4){ state.passError = 'La clave debe tener al menos 4 caracteres.'; render(); return; }
    if(p1 !== p2){ state.passError = 'Las claves no coinciden.'; render(); return; }
    await savePassword(p1);
    state.changingPass = false; state.passError = '';
    render();
  };
  if($('lockBtn')) $('lockBtn').onclick = () => { state.coachAuthed = false; state.changingPass = false; state.coachTab='preguntas'; render(); };

  /* coach: tabs */
  document.querySelectorAll('[data-ctab]').forEach(el => {
    el.onclick = () => { state.coachTab = el.getAttribute('data-ctab'); state.reviewingId = null; render(); };
  });

  /* guarda en el borrador lo que ya está tipeado antes de volver a dibujar el formulario */
  function captureDraftFields(){
    const dq = state.draftQ;
    const t = document.getElementById('qTextInput');
    if(t) dq.text = t.value;
    if(dq.type === 'choice'){
      dq.options = [0,1,2,3].map(i => {
        const el = document.getElementById('qOpt'+i);
        return el ? el.value : dq.options[i];
      });
    }
    const ct = document.getElementById('qCorrectText');
    if(ct) dq.correctText = ct.value;
  }

  /* coach: question type selector */
  document.querySelectorAll('[data-qtype]').forEach(el => {
    el.onclick = () => {
      captureDraftFields();
      state.draftQ.type = el.getAttribute('data-qtype');
      if(state.draftQ.type === 'foto' && state.draftQ.photoMode === 'none') state.draftQ.photoMode = 'own';
      render();
    };
  });

  /* coach: question builder fields */
  document.querySelectorAll('[data-correct]').forEach(el => {
    el.onclick = () => {
      captureDraftFields();
      state.draftQ.correct = Number(el.getAttribute('data-correct'));
      render();
    };
  });
  document.querySelectorAll('[data-tfcorrect]').forEach(el => {
    el.onclick = () => {
      captureDraftFields();
      state.draftQ.tf = el.getAttribute('data-tfcorrect');
      render();
    };
  });

  /* coach: modo de foto para la pregunta (sin foto / propia / general) */
  document.querySelectorAll('[data-photomode]').forEach(el => {
    el.onclick = () => {
      captureDraftFields();
      state.draftQ.photoMode = el.getAttribute('data-photomode');
      render();
    };
  });
  if($('qPhotoInput')) $('qPhotoInput').onchange = async (e) => {
    const f = e.target.files[0];
    if(!f) return;
    try{
      const dataUrl = await readAndResizeImage(f);
      captureDraftFields();
      state.draftQ.photoData = dataUrl;
      state.draftQ.photoChanged = true;
      render();
    }catch(err){ showAlert('No se pudo leer la imagen.'); }
  };
  if($('qPhotoGroupSelect')) $('qPhotoGroupSelect').onchange = async (e) => {
    captureDraftFields();
    const gid = e.target.value || null;
    state.draftQ.photoGroupId = gid;
    if(gid) await loadPhoto(gid);
    render();
  };

  /* coach: fotos generales (reutilizables en varias preguntas) */
  if($('groupPhotoInput')) $('groupPhotoInput').onchange = async (e) => {
    const f = e.target.files[0];
    if(!f) return;
    const nameEl = $('groupNameInput');
    if(nameEl) state.draftPhotoGroup.name = nameEl.value;
    try{
      state.draftPhotoGroup.photoData = await readAndResizeImage(f);
      render();
    }catch(err){ showAlert('No se pudo leer la imagen.'); }
  };
  if($('addPhotoGroupBtn')) $('addPhotoGroupBtn').onclick = async () => {
    const name = ($('groupNameInput') ? $('groupNameInput').value : '').trim();
    const photoData = state.draftPhotoGroup.photoData;
    if(!name){ showAlert('Ponele un nombre a la foto.'); return; }
    if(!photoData){ showAlert('Elegí una imagen.'); return; }
    const gid = newId('pg');
    try{ await window.storage.set('photo:'+gid, photoData, true); state.photoCache[gid] = photoData; }catch(e){ console.error(e); }
    state.photoGroups.push({ id: gid, name });
    await savePhotoGroups();
    state.draftPhotoGroup = { name:'', photoData:null };
    render();
  };
  document.querySelectorAll('[data-deletegroup]').forEach(el => {
    el.onclick = () => {
      const gid = el.getAttribute('data-deletegroup');
      const usedBy = state.questions.filter(q => q.photoGroupId === gid).length;
      const msg = usedBy > 0
        ? `Esta foto se usa en ${usedBy} pregunta(s). Si la borrás, esas preguntas se quedan sin foto. ¿Seguro?`
        : '¿Eliminar esta foto general?';
      showConfirm(msg, async () => {
        state.photoGroups = state.photoGroups.filter(g => g.id !== gid);
        await savePhotoGroups();
        try{ await window.storage.delete('photo:'+gid, true); }catch(e){}
        delete state.photoCache[gid];
        if(usedBy > 0){
          state.questions.forEach(q => { if(q.photoGroupId === gid) q.photoGroupId = null; });
          await saveQuestions();
        }
        render();
      });
    };
  });

  if($('saveQBtn')) $('saveQBtn').onclick = async () => {
    const dq = state.draftQ;
    const text = $('qTextInput').value.trim();
    if(!text){ showAlert('Escribí la pregunta.'); return; }
    const existing = state.editingId ? state.questions.find(x => x.id === state.editingId) : null;
    let q = { id: state.editingId || newId('q'), type: dq.type, text };

    if(dq.type === 'choice'){
      const options = [0,1,2,3].map(i => $('qOpt'+i).value.trim());
      if(options.some(o => !o)){ showAlert('Completá las 4 opciones.'); return; }
      q.options = options; q.correct = dq.correct;
    } else if(dq.type === 'tf'){
      q.correct = dq.tf || null;
    } else if(dq.type === 'foto'){
      const correctText = $('qCorrectText') ? $('qCorrectText').value.trim() : '';
      q.correctText = correctText;
    }

    // resolver la foto según el modo elegido: sin foto / propia / una foto general compartida
    if(dq.photoMode === 'group'){
      if(!dq.photoGroupId){ showAlert('Elegí una foto general, o cambiá el modo de foto.'); return; }
      q.photoGroupId = dq.photoGroupId;
      q.hasPhoto = false;
      if(existing && existing.hasPhoto && !existing.photoGroupId){
        try{ await window.storage.delete('photo:'+q.id, true); }catch(e){}
      }
    } else if(dq.photoMode === 'own'){
      if(!dq.photoData){ showAlert('Subí una foto, o cambiá el modo de foto.'); return; }
      q.photoGroupId = null;
      q.hasPhoto = true;
      try{ await window.storage.set('photo:'+q.id, dq.photoData, true); state.photoCache[q.id] = dq.photoData; }catch(e){ console.error(e); }
    } else {
      q.photoGroupId = null;
      q.hasPhoto = false;
      if(existing && existing.hasPhoto){
        try{ await window.storage.delete('photo:'+q.id, true); }catch(e){}
      }
    }

    if(state.editingId){
      const i = state.questions.findIndex(x => x.id === state.editingId);
      if(i > -1) state.questions[i] = q;
      state.editingId = null;
    } else {
      state.questions.push(q);
    }
    state.draftQ = { type:'choice', text:'', options:['','','',''], correct:0, tf:null, correctText:'', photoMode:'none', photoGroupId:null, photoData:null, photoChanged:false };
    await saveQuestions();
    render();
  };
  if($('cancelEditQ')) $('cancelEditQ').onclick = () => {
    state.editingId = null;
    state.draftQ = { type:'choice', text:'', options:['','','',''], correct:0, tf:null, correctText:'', photoMode:'none', photoGroupId:null, photoData:null, photoChanged:false };
    render();
  };
  document.querySelectorAll('[data-edit]').forEach(el => {
    el.onclick = async () => {
      const id = el.getAttribute('data-edit');
      const q = state.questions.find(q => q.id === id);
      if(!q) return;
      state.editingId = id;
      state.draftQ = {
        type: q.type, text: q.text,
        options: q.type === 'choice' ? [...q.options] : ['','','',''],
        correct: q.type === 'choice' ? q.correct : 0,
        tf: q.type === 'tf' ? q.correct : null,
        correctText: q.correctText || '',
        photoMode: q.photoGroupId ? 'group' : (q.hasPhoto || q.type === 'foto' ? 'own' : 'none'),
        photoGroupId: q.photoGroupId || null,
        photoData: null, photoChanged: false,
      };
      if(questionHasPhoto(q)){ state.draftQ.photoData = await loadPhoto(questionPhotoKey(q)); }
      render();
      window.scrollTo({top:0, behavior:'smooth'});
    };
  });
  document.querySelectorAll('[data-delete]').forEach(el => {
    el.onclick = () => {
      const id = el.getAttribute('data-delete');
      showConfirm('¿Eliminar esta pregunta? Las respuestas ya guardadas para ella se van a mantener pero dejarán de mostrarse en el juego.', async () => {
        const q = state.questions.find(q => q.id === id);
        state.questions = state.questions.filter(q => q.id !== id);
        await saveQuestions();
        if(q && (q.type === 'foto' || q.hasPhoto)){ try{ await window.storage.delete('photo:'+id, true); }catch(e){} }
        render();
      });
    };
  });


  /* coach: jugadores */
  document.querySelectorAll('[data-open]').forEach(el => {
    el.onclick = async (e) => {
      if(e.target.closest('[data-rename],[data-removeplayer]')) return;
      const id = el.getAttribute('data-open');
      state.reviewingId = id;
      const qs = state.questions.filter(questionHasPhoto).map(questionPhotoKey);
      await prefetchPhotos(qs);
      render();
    };
  });
  if($('backToList')) $('backToList').onclick = () => { state.reviewingId = null; render(); };
  document.querySelectorAll('[data-deleteplayer]').forEach(el => {
    el.onclick = () => deletePlayerCompletely(el.getAttribute('data-deleteplayer'));
  });
  document.querySelectorAll('[data-review]').forEach(el => {
    el.onclick = async (e) => {
      e.stopPropagation();
      const [qid, mark] = el.getAttribute('data-review').split('|');
      const pid = el.getAttribute('data-pid');
      if(!state.responses[pid]) state.responses[pid] = { name: findRosterName(pid) || pid, answers:{}, reviewed:{} };
      if(!state.responses[pid].reviewed) state.responses[pid].reviewed = {};
      state.responses[pid].reviewed[qid] = state.responses[pid].reviewed[qid] === mark ? null : mark;
      await saveResponses();
      render();
    };
  });
  document.querySelectorAll('[data-rename]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = el.getAttribute('data-rename');
      const p = state.roster.find(p => p.id === id);
      if(!p) return;
      showPrompt('Nuevo nombre para '+p.name, p.name, async (nuevo) => {
        if(!nuevo || !nuevo.trim()) return;
        p.name = nuevo.trim();
        await saveRoster();
        if(state.responses[id]){ state.responses[id].name = p.name; await saveResponses(); }
        render();
      });
    };
  });
  document.querySelectorAll('[data-removeplayer]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = el.getAttribute('data-removeplayer');
      const p = state.roster.find(p => p.id === id);
      if(!p) return;
      const yaRespondio = state.responses[id] && Object.keys(state.responses[id].answers||{}).length > 0;
      const msg = yaRespondio
        ? `${p.name} ya respondió preguntas. Si lo sacás del plantel, sus respuestas se conservan pero va a figurar como "fuera del plantel". ¿Seguro?`
        : `¿Sacar a ${p.name} del plantel?`;
      showConfirm(msg, async () => {
        state.roster = state.roster.filter(p => p.id !== id);
        await saveRoster();
        render();
      });
    };
  });

  if($('downloadExcelBtn')) $('downloadExcelBtn').onclick = downloadExcel;
  if($('addPlayerBtn')) $('addPlayerBtn').onclick = async () => {
    const input = $('newPlayerInput');
    const name = input ? input.value.trim() : '';
    if(!name){ showAlert('Escribí un nombre.'); return; }
    if(state.roster.some(p => p.name.toLowerCase() === name.toLowerCase())){ showAlert('Ese jugador ya está en el plantel.'); return; }
    state.roster.push({ id: newId('p'), name });
    await saveRoster();
    render();
  };
  if($('newPlayerInput')) $('newPlayerInput').onkeydown = (e) => { if(e.key === 'Enter') $('addPlayerBtn').click(); };
  if($('loadDefaultRosterBtn')) $('loadDefaultRosterBtn').onclick = loadDefaultRoster;
  if($('resetSameQ')) $('resetSameQ').onclick = () => newGame(true);
  if($('resetNewQ')) $('resetNewQ').onclick = () => newGame(false);
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

loadAll();
</script>
</body>
</html>
